name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy board docs into Jekyll source
        run: |
          order=1
          for dir in boards/*/; do
            name=$(basename "$dir")
            [ -f "$dir/README.md" ] || continue
            mkdir -p "docs/boards/$name"
            printf -- "---\ntitle: Board %s\nparent: Boards\nnav_order: %d\n---\n\n" "$name" "$order" \
              | cat - "$dir/README.md" > "docs/boards/$name/index.md"
            order=$((order + 1))
          done

      - name: Generate docs/index.md board list from the current boards
        run: |
          {
            echo "---"
            echo "title: Home"
            echo "nav_order: 1"
            echo "---"
            echo
            echo "# hatsu_ino"
            echo
            echo "> **hatsu** (初, first sound) + **ino** (Arduino) — the first sound your car makes."
            echo
            echo "An Arduino-based JDM car melody box that plays an audio file when you start your car, then enters deep sleep until the next start."
            echo
            echo "## Boards"
            echo
            echo "| Version | Description |"
            echo "|---|---|"
            for dir in boards/*/; do
              name=$(basename "$dir")
              [ -f "$dir/README.md" ] || continue
              desc=$(grep -v '^#\|^>\|^\[!\|^$' "$dir/README.md" | head -1)
              echo "| [$name](boards/$name/) | $desc |"
            done
            echo
            echo "## Source"
            echo
            echo "[github.com/ArturVRSampaio/hatsu_ino](https://github.com/ArturVRSampaio/hatsu_ino)"
          } > docs/index.md

      - name: Generate docs/llms.txt from the current board list
        run: |
          {
            echo "# hatsu_ino"
            echo
            echo "> Arduino-based JDM car melody box that plays an audio file through a speaker when the car's ignition turns on, then sleeps until the next start."
            echo
            echo "hatsu_ino (\"hatsu\" = first sound, \"ino\" = Arduino) is an open-source (MIT licensed) hardware + firmware project. Each board revision is self-contained under \`boards/<version>/\` in the source repo, with its own wiring guide and Arduino sketch."
            echo
            for dir in boards/*/; do
              name=$(basename "$dir")
              [ -f "$dir/README.md" ] || continue
              desc=$(grep -v '^#\|^>\|^\[!\|^$' "$dir/README.md" | head -1)
              echo "- **$name**: $desc"
            done
            echo
            echo "## Docs"
            echo
            echo "- [Home](https://arturvrsampaio.github.io/hatsu_ino/): project overview and board list"
            for dir in boards/*/; do
              name=$(basename "$dir")
              [ -f "$dir/README.md" ] || continue
              echo "- [$name board guide](https://arturvrsampaio.github.io/hatsu_ino/boards/$name/): components, wiring, and setup for $name"
            done
            echo
            echo "## Source"
            echo
            echo "- [GitHub repository](https://github.com/ArturVRSampaio/hatsu_ino): firmware source, native test suite, CI workflows"
            echo "- [LICENSE](https://github.com/ArturVRSampaio/hatsu_ino/blob/master/LICENSE): MIT"
            echo "- [CONTRIBUTING](https://github.com/ArturVRSampaio/hatsu_ino/blob/master/CONTRIBUTING.md): how to add a board variant, fix a bug, or improve the docs"
          } > docs/llms.txt

      - uses: actions/configure-pages@v4

      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
